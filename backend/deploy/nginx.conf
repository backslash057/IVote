# =============================================================================
#  IVote — configuration nginx (reverse proxy vers le backend php -S)
#
#  TEMPLATE : les valeurs __SERVER_NAME__, __PORT__ et __APP_ROOT__ sont
#  remplacées automatiquement par deploy/setup.sh (voir deploy/generated/).
#
#  Installation par l'administrateur du VPS :
#    sudo cp deploy/generated/nginx.conf /etc/nginx/sites-available/ivote.arited.org
#    sudo ln -sf /etc/nginx/sites-available/ivote.arited.org /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#
#  ARCHITECTURE :
#    Clients → nginx (domaine) → proxy → php -S 127.0.0.1:__PORT__
#  Le backend n'écoute QUE sur la boucle locale : il est invisible de
#  l'extérieur. Les fichiers statiques (/public, /uploads) sont servis
#  directement par nginx pour décharger PHP.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    root __APP_ROOT__;
    index router.php;

    # 8 Mo max pour le corps des requêtes (upload d'images).
    client_max_body_size 8m;

    charset utf-8;

    # --- Sécurité ----------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP volontairement permissive sur les scripts inline (le front utilise
    # des handlers inline et charge Google Fonts), mais verrouille le reste.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Fichiers cachés et sources sensibles : jamais exposés.
    location ~ /\. { deny all; access_log off; log_not_found off; }
    location ~* \.(?:sql|md|log|ini|bak|old|env|json)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --- Assets & téléversements (servis par nginx) -------------------
    location ^~ /public/ {
        root __APP_ROOT__;
        try_files $uri =404;
        expires 30d;
        access_log off;

        location ~* \.php$ { deny all; }
        location ~ /\.  { deny all; }
    }

    location ^~ /uploads/ {
        root __APP_ROOT__;
        try_files $uri =404;
        expires 7d;
        access_log off;

        location ~* \.php$ { deny all; }
        location ~ /\.  { deny all; }
    }

    # --- Point d'entrée du domaine : proxy vers le backend ------------
    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # Toute tentative de URL se terminant par .php est refusée au niveau
    # nginx : aucune des pages du backend n'expose d'URL .php.
    location ~* \.php$ {
        deny all;
        return 404;
    }

    # --- Compression ------------------------------------------------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}

# =============================================================================
#  HTTPS — à activer APRÈS installation du certificat :
#
#    sudo apt install certbot python3-certbot-nginx
#    sudo certbot --nginx -d ivote.arited.org
#
#  L'en-tête X-Forwarded-Proto étant posé par nginx, le backend marquera
#  automatiquement les cookies comme `secure` une fois le site en HTTPS.
#  Grep check : `IVOTE_FORWARDED_PROTO` est utilisé par http.php.
#
#  Certbot ajoute lui-même le bloc `listen 443 ssl;` (avec `include` des options
#  ssl) et la redirection HTTP → HTTPS. Pour durcir la configuration, ajoutez
#  DANS le bloc 443 généré par certbot les deux en-têtes suivants (HSTS ne doit
#  JAMAIS être servi en clair : il n'a de sens qu'en HTTPS) :
#
#    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
#
#  Redirection explicite HTTP → HTTPS (équivalent à `certbot --redirect`) :
#
#    server {
#        listen 80;
#        listen [::]:80;
#        server_name ivote.arited.org;
#        return 301 https://$host$request_uri;
#    }
# =============================================================================